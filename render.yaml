# Render Blueprint: one web service with a persistent disk for the database, uploads and private files.
# Deploy: Render dashboard → New → Blueprint → choose this repository.
services:
  - type: web
    name: majesty-method
    runtime: node
    plan: 0.5c-512mb          # smallest paid instance; free instances can't have a disk. Builds run on Render's separate build machines.
    region: frankfurt         # closest Render region to South Africa
    buildCommand: npm ci && npm run build
    startCommand: node node_modules/next/dist/bin/next start -p $PORT   # direct start keeps memory use around 170 MB
    healthCheckPath: /robots.txt
    disk:
      name: site-data
      mountPath: /var/data
      sizeGB: 1               # can grow later, never shrink
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SITE_URL
        value: https://www.majestymethod.com
      - key: APP_SECRET
        generateValue: true   # random 256-bit secret, created once
      - key: SHEETS_WEBHOOK_URL
        sync: false           # fill in after setting up the Apps Script (can be left empty at first)
      - key: SHEETS_WEBHOOK_SECRET
        sync: false
