# Website + automatic HTTPS (Caddy obtains and renews a Let's Encrypt certificate).
# 1. Point your domain's DNS A record at the server.  2. Copy ../.env.example to ../.env and fill it in.
# 3. Edit the domain in Caddyfile.  4. docker compose up -d --build
services:
  web:
    build: ..
    env_file: ../.env
    environment:
      DATA_DIR: /data
    volumes:
      - site-data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]
    restart: unless-stopped
volumes:
  site-data:
  caddy-data:
